# Security headers for the app shell. Included at server level AND inside
# every location that sets its own add_header — nginx drops inherited
# add_header directives in any location that declares one.
#
# CSP: everything comes from this origin. 'unsafe-inline' for styles only
# (React style props); no inline or remote scripts. blob:/data: cover image
# previews and PDF iframes; ws:/wss: the realtime socket.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-src 'self' blob:; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; manifest-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;
# HTTPS only from here on (browsers ignore this header over plain http).
add_header Strict-Transport-Security "max-age=31536000" always;
