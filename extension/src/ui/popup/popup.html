<!doctype html>
<html><head><meta charset="utf-8"><title>Government Portal Autofill</title>
<style>
  body{font:13px/1.45 system-ui,sans-serif;margin:0;width:300px;color:#0f172a}
  header{background:linear-gradient(180deg,#2a4f8f,#1b3a6f);color:#fff;padding:12px 14px;font-weight:600;display:flex;align-items:center;gap:10px}
  header img{width:22px;height:22px;border-radius:5px}
  header small{display:block;font-weight:400;font-size:11px;opacity:.75}
  main{padding:12px 14px}
  dl{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin:0}
  dt{color:#64748b} dd{margin:0;font-weight:600;text-align:right}
  .chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600}
  .ok{background:#ecfdf5;color:#047857}.warn{background:#fffbeb;color:#b45309}.bad{background:#fef2f2;color:#b91c1c}
  button{margin-top:12px;width:100%;height:36px;border:0;border-radius:8px;background:#1b3a6f;color:#fff;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  #msg{margin-top:10px;color:#475569;font-size:12px}
  .note{margin-top:10px;font-size:11px;color:#64748b}
</style></head>
<body><header><img src="icons/icon-48.png" alt=""><div>Government Portal Autofill<small>AuditOS · internal tool</small></div></header><main id="root">Loading…</main><script src="popup.js"></script></body></html>
