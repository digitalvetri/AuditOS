# AUDIT OS — the single origin the browser talks to.
#
# Static bundle at /, API at /api, realtime at /socket.io. Because all three
# are the same origin, `fetch(path, { credentials: 'include' })` in
# src/services/api.ts needs no change between dev and this stack.

upstream auditos_api {
    server api:4000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Tools module uploads real files; nginx's 1m default would reject
    # them long before multer's own limits were consulted.
    client_max_body_size 50m;

    # Never cache the entry document — a redeploy must not leave a browser
    # holding an index.html that points at hashed assets which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Vite emits content-hashed filenames, so these are safe to keep.
    location /assets/ {
        # One header, not two: `expires` would emit its own Cache-Control
        # alongside this one.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://auditos_api;
        proxy_http_version 1.1;
        # The API's CORS allow-list is checked against the BROWSER's Origin,
        # so it is forwarded untouched — the same choice Vite's dev proxy
        # makes with changeOrigin: false.
        proxy_set_header Origin            $http_origin;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Document and tool downloads stream; do not buffer them into nginx.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /socket.io/ {
        proxy_pass http://auditos_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Origin     $http_origin;
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # Client-side routing: every unknown path is a React route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
