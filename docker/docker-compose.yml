# AUDIT OS — the whole stack.
#
#   cd docker
#   cp .env.docker.example .env.docker      # then edit WEB_ORIGIN + the secrets
#   docker compose up -d --build            # or, from the repo root: npm run docker:up
#   open http://localhost:8080
#
# Order of events on a cold start: postgres comes up and passes its
# healthcheck → `migrate` pushes the Prisma schema and runs the seed, then
# exits → `api` starts → `web` starts. `api` never races an empty database,
# because compose waits for `migrate` to complete successfully.
#
# Data lives in the named volumes `auditos-pg-data` (database) and
# `auditos-uploads` (client documents, tool outputs, chat attachments) and
# survives `docker compose down`. To wipe everything: `docker compose down -v`.
#
# Postgres is published on 127.0.0.1 ONLY, so the native dev workflow
# (npm run dev:full against localhost:55432) still works while nothing on the
# network can reach the database. Adminer (database UI) is opt-in:
#   docker compose --profile tools up -d adminer    # → http://127.0.0.1:58080
#
# Production: no default database password exists. Set POSTGRES_PASSWORD and
# a DATABASE_URL that uses it in .env.docker (see .env.docker.example).

# Fixed project name, so the stack keeps the same identity it had when this
# file lived at the repo root (containers and volumes are also named below).
name: auditos-new

services:
  postgres:
    image: postgres:16-alpine
    container_name: auditos-postgres
    restart: unless-stopped
    env_file: .env.docker
    # Host port is deliberately 55432, not 5432 — a native Postgres install
    # on the host commonly holds 5432 and would silently steal connections.
    # Bound to 127.0.0.1: reachable from this machine only, never the network.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - auditos-pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot. Applies the schema and seeds, then exits 0. Both steps are
  # idempotent, so it is safe on every `up` — PROVIDED the image is current.
  #
  # It builds from ../backend, the same source as `api`, but is a SEPARATE image:
  # `docker compose build api` does not rebuild it. Run an image built before a
  # schema change and `prisma db push` sees the new tables as ones to DROP —
  # it refuses (exit 1, "Use the --accept-data-loss flag"), which is the
  # failure working as intended, not a bug to flag past. The fix is to rebuild,
  # never to add --accept-data-loss: that flag would carry out the deletion.
  # Always bring the stack up with `--build`, as the header says.
  migrate:
    build:
      context: ../backend
      target: toolchain
    container_name: auditos-migrate
    # DATABASE_URL comes from .env.docker, next to POSTGRES_PASSWORD, so the
    # two can never disagree (compose does not read .env.docker when it
    # interpolates ${...}, so a URL built here would fall back to a default).
    env_file: .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../backend
      target: runtime
    container_name: auditos-api
    restart: unless-stopped
    # DATABASE_URL comes from .env.docker (inside the network Postgres is
    # `postgres:5432`, never the host's 55432).
    env_file: .env.docker
    environment:
      NODE_ENV: production
      PORT: "4000"
    volumes:
      - auditos-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Not published on the host: the browser reaches the API through `web`,
    # which keeps everything on one origin. Add a ports entry only if you
    # need to curl the API directly.
    expose:
      - "4000"

  web:
    build:
      context: ../frontend
      target: runtime
    container_name: auditos-web
    restart: unless-stopped
    # Production behind the https profile: set WEB_BIND_ADDRESS=127.0.0.1 so
    # plain HTTP is reachable only through Caddy on this machine.
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_HOST_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  # Nightly pg_dump + uploads archive into docker/backups/ (BACKUP_HOST_DIR),
  # 14 days kept. Copy that folder off this machine. See backup/backup.sh.
  backup:
    image: postgres:16-alpine
    container_name: auditos-backup
    restart: unless-stopped
    env_file: .env.docker
    command: ["sh", "/backup.sh"]
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - auditos-uploads:/uploads:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # HTTPS with automatic Let's Encrypt certificates for DOMAIN (in .env.docker):
  #   docker compose --profile https up -d --build
  caddy:
    profiles: ["https"]
    image: caddy:2.8-alpine
    container_name: auditos-caddy
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - auditos-caddy-data:/data
      - auditos-caddy-config:/config
    depends_on:
      - web

  # Database UI — opt-in and local-only. Never run it on a server facing the
  # internet:  docker compose --profile tools up -d adminer
  adminer:
    profiles: ["tools"]
    image: adminer:4
    container_name: auditos-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMINER_HOST_PORT:-58080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  # Builds the government-portal autofill Chrome extension into extension/dist
  # (no Node needed on the host). Not part of the running stack — run it on
  # demand, then load extension/dist via chrome://extensions → Load unpacked:
  #   docker compose --profile tools run --rm extension-build
  extension-build:
    profiles: ["tools"]
    image: node:20-bookworm-slim
    working_dir: /ext
    volumes:
      - ../extension:/ext
    command: sh -c "npm ci --no-audit --no-fund && npm run build && npm test"
    restart: "no"

volumes:
  auditos-pg-data:
    name: auditos-pg-data
  auditos-uploads:
    name: auditos-uploads
  auditos-caddy-data:
    name: auditos-caddy-data
  auditos-caddy-config:
    name: auditos-caddy-config
