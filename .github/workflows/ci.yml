# AUDIT OS — CI.
#
# Runs on GitHub's machines only. It never reads anyone's local .env and never
# touches a contributor's database: every run gets its own throwaway Postgres,
# discarded when the job ends. The credentials below exist only inside that
# container, so they are safe to commit. Real secrets belong in
# Settings → Secrets, referenced as ${{ secrets.NAME }} — never in this file.
#
# A branch triggers CI on its first `git push` (a local `git checkout -b` is
# invisible to GitHub), and on every push after that.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # `tsc -b && vite build` — a type error fails the check.
      - run: npm run build

  backend:
    name: Backend — typecheck, build, test & boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auditos
          POSTGRES_PASSWORD: auditos_ci_pw
          POSTGRES_DB: auditos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U auditos -d auditos"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Two databases, as in local dev: the app DB is seeded and booted
      # against; the vitest suite force-resets its own.
      DATABASE_URL: postgresql://auditos:auditos_ci_pw@localhost:5432/auditos?schema=public
      TEST_DATABASE_URL: postgresql://auditos:auditos_ci_pw@localhost:5432/auditos_test?schema=public
      # development, not production: secrets are then generated per process
      # and Zoho Payments runs in its fake mode, so CI needs no real keys.
      NODE_ENV: development
      ZPAY_MODE: fake
      PORT: '4000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Create the test database
        run: PGPASSWORD=auditos_ci_pw psql -h localhost -U auditos -d auditos -c 'CREATE DATABASE auditos_test'
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Same two steps the `migrate` container runs in docker compose.
      - name: Push schema and seed
        run: |
          npm run prisma:push
          npm run seed
      - name: Start the API and check it boots
        run: |
          npm start > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs http://localhost:4000/api/health; then echo; echo 'API is up'; exit 0; fi
            sleep 2
          done
          echo 'API did not answer /api/health within 60s'
          cat api.log
          exit 1

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          target: runtime
          push: false
