# Typecheck, test and build on every push and pull request to main.
#
# The backend tests run against a throwaway Postgres service. The test
# global setup force-resets the database it is pointed at, so it only ever
# gets this CI-only database — never a real one.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tsc + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auditos
          POSTGRES_PASSWORD: auditos_ci_pw
          POSTGRES_DB: auditos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auditos -d auditos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Test database only (the CI service above).
      DATABASE_URL: postgresql://auditos:auditos_ci_pw@localhost:5432/auditos_test?schema=public
      TEST_DATABASE_URL: postgresql://auditos:auditos_ci_pw@localhost:5432/auditos_test?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Generate the Prisma client
        run: npx prisma generate
      - name: Push the schema to the CI test database
        run: npx prisma db push --skip-generate --accept-data-loss
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Tests
        run: npx vitest run

  frontend:
    name: Frontend (tsc + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npx vite build
