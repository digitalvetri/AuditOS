# Local Postgres + Adminer for AUDIT OS.
#
# Usage:
#   cp .env.docker.example .env.docker
#   docker compose up -d
#   npm --prefix server run prisma:generate
#   npm --prefix server run prisma:push
#   npm --prefix server run seed
#
# The primary database is `auditos`; `auditos_test` is created for the
# server test suite. Both share one Postgres container.
#
# Data lives in the named volume `auditos-pg-data` and survives `down`.
# To wipe: `docker compose down -v` (removes the volume too).

services:
  postgres:
    image: postgres:16-alpine
    container_name: auditos-postgres
    restart: unless-stopped
    env_file: .env.docker
    # Host port is deliberately 55432, not 5432 — a native Postgres install
    # on the host commonly holds 5432 and would silently steal connections.
    # Override with `POSTGRES_HOST_PORT=... docker compose up -d` if needed.
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - auditos-pg-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: auditos-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_HOST_PORT:-58080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  auditos-pg-data:
    name: auditos-pg-data
